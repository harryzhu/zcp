syntax = "proto3";

package pb;
option go_package=".;pb";

service FileTransfer {
  rpc StreamReceive(stream File) returns (File) {}
  rpc Head(File) returns (File) {}
  rpc GetMisc(Misc) returns (Misc) {}
  rpc PutMisc(Misc) returns (Misc) {}
}

message File {
  int32 status = 1;
  bytes comment = 2;
  bytes path = 3;
  bytes ftype = 4;
  bytes finfo = 5;
  bytes fsum = 6;
  int64 fsize = 7;
  int64 offsetFrom = 8;
  int64 offsetTo = 9;
  bytes data = 10;
}

message Misc {
  string mtype = 1;
  bytes data = 2;
}

